[project]
name = "run"
version = "0.5.0"
description = "Automation script for Solution simulations"
authors = []
dependencies = [
    "cosmotech-api==5.0.0-rc1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "rich>=13.7.0",
    "python-keycloak>=0.26.1",
    "ruff>=0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = [
  "run/templates/*.yaml"
]
